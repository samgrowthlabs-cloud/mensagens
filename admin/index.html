<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BIDJORCHAT - Admin Panel</title>
  
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <link rel="stylesheet" href="../styles/variables.css">
  <link rel="stylesheet" href="../styles/global.css">
  <link rel="stylesheet" href="../styles/responsive.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="admin-layout">
    <header class="admin-header">
      <div class="admin-header-left">
        <h1 class="admin-title">BIDJORCHAT</h1>
        <span class="admin-badge">ADMIN</span>
      </div>
      <div class="admin-header-right">
        <button class="btn-add-user" onclick="showCreateUserModal()">+ Novo Usuário</button>
        <button class="btn-chat" onclick="goToChat()" title="Ir para o Chat">💬 Chat</button>
        <button class="btn-logout" onclick="handleLogout()">Sair</button>
      </div>
    </header>
    
    <main class="admin-content">
      <div class="admin-controls">
        <div class="search-box">
          <input type="text" id="userSearch" placeholder="Buscar usuários..." class="search-input">
        </div>
      </div>
      
      <div class="table-container">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Usuário</th>
              <th>Email</th>
              <th>Cargo</th>
              <th>Status</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="usersTableBody">
            <tr>
              <td colspan="5">
                <div class="skeleton" style="height:40px;margin:4px;"></div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>
  
  <!-- Modal Criar Usuário -->
  <div id="createUserModal" class="modal-overlay" style="display:none;">
    <div class="modal">
      <h2 class="modal-title">Criar Novo Usuário</h2>
      <div class="modal-body">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="newUsername" class="form-input" placeholder="username">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="newEmail" class="form-input" placeholder="email@exemplo.com">
        </div>
        <div class="form-group">
          <label>Senha</label>
          <input type="password" id="newPassword" class="form-input" placeholder="Senha inicial">
        </div>
        <div class="form-group">
          <label>Cargo</label>
          <select id="newRole" class="form-input">
            <option value="user">USER</option>
            <option value="moderator">MODERATOR</option>
            <option value="admin">ADMIN</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" onclick="closeCreateUserModal()">Cancelar</button>
        <button class="btn-save" onclick="createUser()">Criar</button>
      </div>
    </div>
  </div>
  
  <!-- Modal Editar Usuário -->
  <div id="editUserModal" class="modal-overlay" style="display:none;">
    <div class="modal">
      <h2 class="modal-title">Editar Usuário</h2>
      <div class="modal-body">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="editUsername" class="form-input">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="editEmail" class="form-input">
        </div>
        <div class="form-group">
          <label>Cargo</label>
          <select id="editRole" class="form-input">
            <option value="user">USER</option>
            <option value="moderator">MODERATOR</option>
            <option value="admin">ADMIN</option>
          </select>
        </div>
        <div class="form-group">
          <label>Resetar Senha</label>
          <input type="password" id="editNewPassword" class="form-input" placeholder="Nova senha (opcional)">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" onclick="closeEditUserModal()">Cancelar</button>
        <button class="btn-save" onclick="saveUserEdit()">Salvar</button>
      </div>
    </div>
  </div>
  
  <!-- Scripts na ordem correta -->
  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/crypto.js"></script>
  <script src="../js/database.js"></script>
  <script src="../js/session.js"></script>
  <script src="script.js"></script>
</body>
</html>
