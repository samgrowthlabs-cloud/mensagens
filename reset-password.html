<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <!-- Favicon -->
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/icon-16.png">
<link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
  <!-- PWA -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0a0a0a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BIDJORCHAT">
<link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BIDJORCHAT - Recuperar Senha</title>
  <link rel="stylesheet" href="styles/variables.css">
  <link rel="stylesheet" href="styles/global.css">
  <link rel="stylesheet" href="login/style.css">
  <style>
    .temp-password-box {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      border-radius: 8px;
      padding: 16px;
      margin-top: 16px;
      text-align: center;
      word-break: break-all;
      font-family: monospace;
      font-size: 18px;
      font-weight: bold;
      color: #22c55e;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <div class="login-header">
        <h1 class="app-title">BIDJORCHAT</h1>
        <p class="app-subtitle">Recuperar Senha</p>
      </div>
      
      <form id="resetForm" class="login-form">
        <div class="form-group">
          <label for="email">Email cadastrado</label>
          <input type="email" id="email" placeholder="seu@email.com" required autocomplete="email">
        </div>
        
        <div id="message" style="display:none; margin-top:12px;"></div>
        
        <button type="submit" class="btn-login">
          <span class="btn-text">Gerar nova senha</span>
        </button>
      </form>
      
      <div class="login-footer">
        <a href="login/index.html">Voltar ao Login</a>
      </div>
    </div>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/crypto.js"></script>
  <script src="js/database.js"></script>
  <script src="js/session.js"></script>
  <script>
    // Função para gerar senha amigável (8 caracteres, letras e números)
    function generateFriendlyPassword(length = 8) {
      const chars = 'abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // sem caracteres ambíguos
      let password = '';
      for (let i = 0; i < length; i++) {
        password += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return password;
    }

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value.trim();
      const messageDiv = document.getElementById('message');
      const submitBtn = document.querySelector('.btn-login');
      
      // Reset
      messageDiv.style.display = 'none';
      
      if (!email) {
        showMessage('Digite um email válido', 'error');
        return;
      }
      
      // Loading
      submitBtn.classList.add('loading');
      
      try {
        // Aguardar DB
        let attempts = 0;
        while (!db && attempts < 50) {
          await new Promise(resolve => setTimeout(resolve, 100));
          attempts++;
        }
        
        if (!db) {
          throw new Error('Banco de dados não inicializado');
        }
        
        // Buscar usuário por email
        const user = await databaseManager.getUserByEmail(email);
        
        if (!user) {
          showMessage('Email não encontrado no sistema', 'error');
          return;
        }
        
        if (user.is_banned) {
          showMessage('Esta conta está banida', 'error');
          return;
        }
        
        // Gerar senha temporária amigável
        const tempPassword = generateFriendlyPassword(8);
        
        // Atualizar senha no banco (o databaseManager já faz o hash)
        await databaseManager.updateUser(user.id, { password: tempPassword });
        
        // Exibir senha temporária
        messageDiv.innerHTML = `
          <div style="color: #22c55e; font-weight: 600; margin-bottom: 8px;">✅ Nova senha gerada!</div>
          <div>Sua senha temporária é:</div>
          <div class="temp-password-box">${tempPassword}</div>
          <div style="font-size: 13px; color: #9ca3af; margin-top: 12px;">
            Copie esta senha e faça login.<br>
            Depois altere para uma senha pessoal no perfil.
          </div>
        `;
        messageDiv.style.display = 'block';
        messageDiv.style.background = 'rgba(34, 197, 94, 0.05)';
        messageDiv.style.border = '1px solid rgba(34, 197, 94, 0.2)';
        messageDiv.style.borderRadius = '8px';
        messageDiv.style.padding = '16px';
        
        // Limpar formulário
        document.getElementById('email').value = '';
        
      } catch (error) {
        console.error('Erro ao resetar senha:', error);
        showMessage('Erro ao processar: ' + error.message, 'error');
      } finally {
        submitBtn.classList.remove('loading');
      }
    });
    
    function showMessage(msg, type) {
      const messageDiv = document.getElementById('message');
      messageDiv.textContent = msg;
      messageDiv.style.display = 'block';
      messageDiv.style.background = type === 'error' ? 'rgba(239, 68, 68, 0.1)' : 'rgba(34, 197, 94, 0.05)';
      messageDiv.style.border = type === 'error' ? '1px solid rgba(239, 68, 68, 0.3)' : '1px solid rgba(34, 197, 94, 0.2)';
      messageDiv.style.borderRadius = '8px';
      messageDiv.style.padding = '12px';
      messageDiv.style.color = type === 'error' ? '#ef4444' : '#22c55e';
    }
  </script>
  <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/service-worker.js')
        .then(() => console.log('✅ Service Worker registrado'))
        .catch((err) => console.log('❌ Service Worker falhou:', err));
    });
  }
</script>
</body>
</html>
