<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>BIDJORCHAT - Chat Privado</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/icon-32.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BIDJORCHAT">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="../styles/variables.css">
  <link rel="stylesheet" href="../styles/global.css">
  <link rel="stylesheet" href="../styles/responsive.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="chat-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="user-profile-header" onclick="showProfileModal()">
          <div class="user-avatar" id="currentUserAvatar"><span id="currentUserInitials">?</span></div>
          <div class="user-info-header">
            <div class="username-header" id="currentUsername">Carregando...</div>
            <div class="role-header" id="currentUserRole"></div>
          </div>
        </div>
        <button class="btn-geral" onclick="window.location.href='/mensagem_geral/index.html'">Chat Geral</button>
        <button class="btn-logout" onclick="handleLogout()" title="Sair">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>
      <div class="search-container">
        <input type="text" id="userSearch" placeholder="Buscar usuários..." class="search-input" autocomplete="off">
      </div>
      <div class="users-list" id="usersList"></div>
    </aside>

    <main class="chat-main" id="chatMain">
      <header class="chat-header mobile-only">
        <button class="btn-back" id="btnBackToContacts" onclick="backToContacts()" style="display:none;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"/>
            <polyline points="12 19 5 12 12 5"/>
          </svg>
        </button>
        <div class="chat-header-user" id="chatHeaderUser">BIDJORCHAT</div>
      </header>

      <div class="user-info-bar" id="userInfoBar" style="display:none;"></div>
      <div class="messages-container" id="messagesContainer"></div>

      <button id="scrollToBottomBtn" class="scroll-to-bottom-btn" title="Rolar para o final">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </button>

      <div class="no-chat-selected" id="noChatSelected">
        <div class="no-chat-icon"></div>
        <h2>BIDJORCHAT</h2>
        <p>Selecione um usuário para começar</p>
      </div>

      <div class="typing-indicator" id="typingIndicator" style="display:none;"></div>
      <div class="message-input-container" id="messageInputContainer" style="display: none;">
        <textarea id="messageInput" placeholder="Mensagem..." rows="1" maxlength="5000"></textarea>
        <button class="btn-send" onclick="sendMessage()" title="Enviar">➤</button>
      </div>
    </main>
  </div>

  <div id="profileModal" class="modal-overlay" style="display: none;">
    <div class="modal">
      <h2 class="modal-title">Editar Perfil</h2>
      <div class="modal-body">
        <div class="avatar-upload">
          <div class="avatar-preview" id="avatarPreview"><span id="avatarPreviewInitials">?</span></div>
          <input type="file" id="avatarInput" accept="image/*" style="display: none;" onchange="handleAvatarUpload(event)">
          <button class="btn-change-avatar" onclick="document.getElementById('avatarInput').click()">Alterar foto</button>
        </div>
        <div class="form-group">
          <label>Username (minúsculas, sem espaços ou caracteres especiais)</label>
          <input type="text" id="editUsername" class="form-input" maxlength="20">
        </div>
        <div class="form-group">
          <label>Status</label>
          <input type="text" id="editStatusMessage" class="form-input" placeholder="Ex: Disponível, Ocupado...">
        </div>
        <div class="form-group">
          <label>Nova Senha (opcional)</label>
          <input type="password" id="editNewPassword" class="form-input" placeholder="Deixe em branco">
        </div>
        <div class="form-group">
          <label>Senha Atual (obrigatória)</label>
          <input type="password" id="editCurrentPassword" class="form-input" placeholder="Digite sua senha atual">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" onclick="closeProfileModal()">Cancelar</button>
        <button class="btn-save" onclick="saveProfile()">Salvar</button>
      </div>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/crypto.js"></script>
  <script src="../js/database.js"></script>
  <script src="../js/session.js"></script>
  <script src="script.js"></script>
</body>
</html>
