<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>BIDJORCHAT</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <link rel="stylesheet" href="../styles/variables.css">
  <link rel="stylesheet" href="../styles/global.css">
  <link rel="stylesheet" href="../styles/responsive.css">
  <link rel="stylesheet" href="style.css">
  
  <style>
    /* Ajustes críticos para mobile */
    .no-chat-selected {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-tertiary);
      text-align: center;
      padding: 20px;
    }
    
    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: none; /* escondido até selecionar alguém */
    }
    
    .messages-container.active {
      display: block;
    }
  </style>
</head>
<body>
  <div class="chat-layout">
    <!-- Overlay mobile -->
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>
    
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="user-profile-header">
          <div class="user-avatar" id="currentUserAvatar" onclick="showProfileModal()">
            <span id="currentUserInitials">?</span>
          </div>
          <div class="user-info-header">
            <div class="username-header" id="currentUsername">Carregando...</div>
            <div class="role-header" id="currentUserRole"></div>
          </div>
        </div>
        <button class="btn-logout" onclick="handleLogout()" title="Sair">🚪</button>
      </div>
      
      <div class="search-container">
        <div class="search-input-wrapper">
          <span class="search-icon">🔍</span>
          <input 
            type="text" 
            id="userSearch" 
            placeholder="Buscar usuários..." 
            class="search-input"
            autocomplete="off"
          >
        </div>
      </div>
      
      <div class="users-list" id="usersList">
        <div class="skeleton" style="height:60px; margin:8px;"></div>
        <div class="skeleton" style="height:60px; margin:8px;"></div>
        <div class="skeleton" style="height:60px; margin:8px;"></div>
      </div>
    </aside>
    
    <!-- Chat Principal -->
    <main class="chat-main">
      <header class="chat-header mobile-only">
        <button class="btn-menu" onclick="toggleSidebar()">☰</button>
        <div class="chat-header-user" id="chatHeaderUser">
          <span>BIDJORCHAT</span>
        </div>
      </header>
      
      <!-- Container de mensagens (oculto até selecionar) -->
      <div class="messages-container" id="messagesContainer"></div>
      
      <!-- Estado vazio (fora do container) -->
      <div class="no-chat-selected" id="noChatSelected">
        <div class="no-chat-icon">💬</div>
        <h2>BIDJORCHAT</h2>
        <p>Selecione um usuário para começar</p>
      </div>
      
      <!-- Input (oculto até selecionar) -->
      <div class="message-input-container" id="messageInputContainer" style="display: none;">
        <textarea 
          id="messageInput" 
          placeholder="Mensagem..." 
          rows="1"
          maxlength="5000"
        ></textarea>
        <button class="btn-send" onclick="sendMessage()" title="Enviar">➤</button>
      </div>
    </main>
    
    <!-- Painel de info -->
    <aside class="info-panel" id="infoPanel" style="display: none;">
      <div class="info-panel-header">
        <button class="btn-close-panel" onclick="closeInfoPanel()">✕</button>
      </div>
      <div class="info-panel-content" id="infoPanelContent"></div>
    </aside>
  </div>
  
  <!-- Modal de Perfil -->
  <div id="profileModal" class="modal-overlay" style="display: none;">
    <div class="modal">
      <h2 class="modal-title">Editar Perfil</h2>
      <div class="modal-body">
        <div class="profile-edit">
          <div class="avatar-upload">
            <div class="avatar-preview" id="avatarPreview">
              <span id="avatarPreviewInitials">?</span>
            </div>
            <input type="file" id="avatarInput" accept="image/*" style="display: none;" onchange="handleAvatarUpload(event)">
            <button class="btn-change-avatar" onclick="document.getElementById('avatarInput').click()">
              Alterar foto
            </button>
          </div>
          
          <div class="form-group">
            <label>Username</label>
            <input type="text" id="editUsername" class="form-input">
          </div>
          
          <div class="form-group">
            <label>Nova Senha (opcional)</label>
            <input type="password" id="editNewPassword" class="form-input" placeholder="Deixe em branco">
          </div>
          
          <div class="form-group">
            <label>Senha Atual</label>
            <input type="password" id="editCurrentPassword" class="form-input" placeholder="Obrigatória">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" onclick="closeProfileModal()">Cancelar</button>
        <button class="btn-save" onclick="saveProfile()">Salvar</button>
      </div>
    </div>
  </div>
  
  <!-- Scripts na ordem correta -->
  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/crypto.js"></script>
  <script src="../js/database.js"></script>
  <script src="../js/session.js"></script>
  <script src="script.js"></script>
</body>
</html>
