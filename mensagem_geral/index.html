<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>BIDJORCHAT - Chat Geral</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/icon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/icon-16.png">
  <link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
  
  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BIDJORCHAT">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <link rel="stylesheet" href="../styles/variables.css">
  <link rel="stylesheet" href="../styles/global.css">
  <link rel="stylesheet" href="../styles/responsive.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="chat-geral-layout">
    <!-- Header -->
    <header class="geral-header">
        <div class="geral-header-left">
            <h1 class="geral-title">BIDJORCHAT</h1>
            <span class="geral-subtitle">Chat Geral</span>
        </div>

        <div class="online-counter">
            <span class="online-dot"></span>
            <span id="onlineCount">0</span> online
        </div>
        <div class="geral-header-right">
            <button class="btn-header" onclick="window.location.href='/chat/index.html'" title="Chat Privado">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
            </button>
            <button class="btn-header" id="btnAdminPanel" onclick="window.location.href='/admin/index.html'" title="Painel Admin" style="display:none;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"/>
                <path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/>
            </svg>
            </button>
            
            <button class="btn-header danger" onclick="handleLogout()" title="Sair">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            </button>
        </div>

    </header>

    <!-- Área de mensagens -->
    <div class="announcement-banner" id="announcementBanner" style="display:none;"></div>
    <div class="geral-messages" id="geralMessages">
      <div class="geral-loading">Carregando mensagens...</div>
    </div>

    <!-- 🔽 BOTÃO FLUTUANTE (NOVO) -->
    <button id="scrollToBottomBtn" class="scroll-to-bottom-btn" title="Rolar para o final">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 12 15 18 9"/>
      </svg>
    </button>

    <!-- Input -->
    <div class="geral-input-container">
    <button class="btn-gif" id="gifPickerBtn" title="Escolher GIF">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
        <line x1="9" y1="9" x2="15" y2="9"/>
        <line x1="9" y1="13" x2="13" y2="13"/>
        </svg>
    </button>

    
    <textarea 
        id="geralMessageInput" 
        placeholder="Digite sua mensagem..." 
        rows="1"
        maxlength="2000"
    ></textarea>

    <!-- Dentro de .geral-input-container, após o botão de GIF ou antes do textarea -->
    <button class="btn-audio" id="audioRecordBtn" title="Gravar áudio (clique longo para enviar arquivo)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
    </button>
    <input type="file" id="audioFileInput" accept="audio/*" style="display:none">
    <button class="btn-send" onclick="sendGeralMessage()" title="Enviar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
    </button>

    
    </div>

    <!-- Indicador de último visto -->
    <div class="last-seen-indicator" id="lastSeenIndicator">
        <span class="last-seen-icon">👁️</span>
        <span id="lastSeenText">Carregando...</span>
    </div>
  </div>

  <!-- Modal de perfil do usuário -->
  <div id="userProfileModal" class="modal-overlay" style="display:none;"></div>

  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/crypto.js"></script>
  <script src="../js/database.js"></script>
  <script src="../js/session.js"></script>
  <script src="script.js"></script>

  <!-- Modal do presente (inicialmente oculto) -->
  <div id="presentModal" class="modal-overlay" style="display:none;">
      <div class="present-modal">
          <button class="present-close" onclick="closePresentModal()">✕</button>
          <div class="present-box">
              <div class="present-icon">🎁</div>
              <div class="present-gift" id="presentGiftContent"></div>
              <div class="present-message" id="presentMessage"></div>
          </div>
      </div>
  </div>
</body>
</html>
