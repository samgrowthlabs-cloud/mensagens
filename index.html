<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <!-- Favicon -->
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/icon-16.png">
<link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
    <!-- PWA -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0a0a0a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BIDJORCHAT">
<link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIDJORCHAT</title>
    <script>
        // Redirecionamento automático
        const session = localStorage.getItem('bidjorchat_session');
        
        if (session) {
            try {
                const sessionData = JSON.parse(session);
                if (sessionData.user && sessionData.user.role === 'admin') {
                    window.location.href = '/admin/index.html';
                } else {
                    window.location.href = '/chat/index.html';
                }
            } catch (e) {
                window.location.href = '/login/index.html';
            }
        } else {
            window.location.href = '/login/index.html';
        }
    </script>
</head>
<body>
    <div style="
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: #0a0a0a;
        color: white;
        font-family: -apple-system, sans-serif;
    ">
        <p>Redirecionando...</p>
    </div>
    <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/service-worker.js')
        .then(() => console.log('✅ Service Worker registrado'))
        .catch((err) => console.log('❌ Service Worker falhou:', err));
    });
  }
</script>
</body>
</html>
