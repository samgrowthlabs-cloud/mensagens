<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <!-- Favicon -->
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/icon-16.png">
<link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
  <!-- PWA -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0a0a0a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BIDJORCHAT">
<link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BIDJORCHAT - Login</title>
  
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <link rel="stylesheet" href="../styles/variables.css">
  <link rel="stylesheet" href="../styles/global.css">
  <link rel="stylesheet" href="../styles/responsive.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <div class="login-header">
        <h1 class="app-title">BIDJORCHAT</h1>
        <p class="app-subtitle">Mensagens Privadas</p>
      </div>
      
      <form id="loginForm" class="login-form">
        <div class="form-group">
          <label for="usernameOrEmail">Username ou Email</label>
          <input 
            type="text" 
            id="usernameOrEmail" 
            placeholder="seu@email.com ou username" 
            autocomplete="username"
            required
          >
        </div>
        
        <div class="form-group">
          <label for="password">Senha</label>
          <div class="password-input">
            <input 
              type="password" 
              id="password" 
              placeholder="Sua senha" 
              autocomplete="current-password"
              required
            >
            <button type="button" class="toggle-password" onclick="togglePassword()">
              👁️
            </button>
          </div>
        </div>
        
        <div id="errorMessage" class="error-message" style="display: none;"></div>
        
        <button type="submit" class="btn-login">
          <span class="btn-text">Entrar</span>
          <span class="btn-loader" style="display: none;">Carregando...</span>
        </button>
      </form>
      
      <div class="login-footer">
        <a href="../reset-password.html">Esqueceu a senha?</a>
      </div>
    </div>
  </div>
  
  <!-- Scripts na ordem correta -->
  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/crypto.js"></script>
  <script src="../js/database.js"></script>
  <script src="../js/session.js"></script>
  <script src="script.js"></script>
  <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/service-worker.js')
        .then(() => console.log('✅ Service Worker registrado'))
        .catch((err) => console.log('❌ Service Worker falhou:', err));
    });
  }
</script>
</body>
</html>
